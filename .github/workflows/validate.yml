name: Validate and package

on:
  schedule:
    - cron: "17 0,12 * * *"
  workflow_dispatch:
    inputs:
      force_rebuild:
        description: Rebuild even when the nightly release already points at HEAD
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: lumasave-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: Check for unreleased commits
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.gate.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - id: gate
        name: Compare HEAD with the nightly release
        shell: bash
        env:
          FORCE_REBUILD: ${{ github.event_name == 'workflow_dispatch' && inputs.force_rebuild }}
        run: |
          set -euo pipefail
          published_commit="$(git ls-remote origin refs/tags/nightly | cut -f1)"
          if [[ "$FORCE_REBUILD" == "true" || -z "$published_commit" || "$published_commit" != "$GITHUB_SHA" ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "HEAD has not been released; validation and packaging will run."
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "The nightly release already points at HEAD; stopping before package jobs."
          fi

  arch:
    needs: gate
    if: needs.gate.outputs.changed == 'true'
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - name: Install build dependencies
        run: >-
          pacman -Syu --noconfirm --needed git cmake extra-cmake-modules rust
          kwin libkscreen kcmutils qt6-base qt6-declarative plasma-workspace
          kdialog desktop-file-utils ripgrep python
          github-cli vulkan-headers
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Trust the container checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Validate
        run: ./scripts/validate-release.sh
      - name: Build KWin-versioned Arch package
        shell: bash
        run: |
          git archive --format=tar.gz --prefix=lumasave/ -o lumasave-src.tar.gz HEAD
          cp PKGBUILD PKGBUILD.ci
          sed -i 's|source=(.*|source=("lumasave::file://'"$PWD"'/lumasave-src.tar.gz")|' PKGBUILD
          useradd -m builder
          chown -R builder:builder "$GITHUB_WORKSPACE"
          runuser -u builder -- makepkg --noconfirm --nodeps
          mv PKGBUILD.ci PKGBUILD
          mkdir -p "$GITHUB_WORKSPACE/artifacts"
          mv ./*.pkg.tar.zst "$GITHUB_WORKSPACE/artifacts/"
          printf '%s\n' "$GITHUB_SHA" > "$GITHUB_WORKSPACE/artifacts/commit.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: lumasave-arch-${{ github.sha }}
          path: artifacts/
          retention-days: 7

  rpm:
    needs: gate
    if: needs.gate.outputs.changed == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - distro: fedora-44
            container: fedora:44
          - distro: opensuse-tumbleweed
            container: opensuse/tumbleweed:latest
    container: ${{ matrix.container }}
    steps:
      - name: Install Fedora build dependencies
        if: matrix.distro == 'fedora-44'
        run: >-
          dnf install -y git tar gzip rpm-build cmake gcc-c++ cargo rust
          extra-cmake-modules kf6-kcmutils-devel kwin kwin-devel
          libkscreen-devel qt6-qtbase-devel qt6-qtdeclarative-devel
          libdrm-devel libepoxy-devel wayland-devel wayland-protocols-devel
          vulkan-headers
      - name: Install openSUSE build dependencies
        if: matrix.distro == 'opensuse-tumbleweed'
        run: >-
          zypper --non-interactive install git tar gzip rpm-build cmake
          gcc-c++ cargo rust kf6-extra-cmake-modules kf6-kcmutils-devel
          kf6-kwindowsystem-devel
          kwin6 kwin6-devel libkscreen6-devel qt6-base-devel
          qt6-declarative-devel libdrm-devel libepoxy-devel wayland-devel
          wayland-protocols-devel vulkan-headers
      - uses: actions/checkout@v4
      - name: Build KWin-versioned RPM
        shell: bash
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          mkdir -p "$HOME/rpmbuild/SOURCES" artifacts
          git archive --format=tar.gz --prefix=lumasave/ -o "$HOME/rpmbuild/SOURCES/lumasave.tar.gz" HEAD
          rpmbuild -bb --define "_topdir $HOME/rpmbuild" packaging/rpm/lumasave.spec
          find "$HOME/rpmbuild/RPMS" -type f -name '*.rpm' -exec mv -t artifacts {} +
      - uses: actions/upload-artifact@v4
        with:
          name: lumasave-${{ matrix.distro }}-${{ github.sha }}
          path: artifacts/
          retention-days: 7

  deb:
    needs: gate
    if: needs.gate.outputs.changed == 'true'
    runs-on: ubuntu-latest
    container: ubuntu:26.04
    steps:
      - name: Install Ubuntu/Kubuntu build dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: >-
          apt-get update && apt-get install -y git build-essential
          devscripts debhelper cmake cargo rustc extra-cmake-modules
          kwin-dev libkscreen-dev libkf6kcmutils-dev qt6-base-dev
          qt6-declarative-dev libdrm-dev libwayland-dev wayland-protocols
          libvulkan-dev pkg-config
      - uses: actions/checkout@v4
      - name: Build KWin-versioned Ubuntu/Kubuntu package
        shell: bash
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          dpkg-buildpackage --build=binary --no-sign
          mkdir artifacts
          mv ../lumasave_*_amd64.deb artifacts/
      - uses: actions/upload-artifact@v4
        with:
          name: lumasave-ubuntu-26.04-${{ github.sha }}
          path: artifacts/
          retention-days: 7

  nightly:
    needs: [gate, arch, rpm, deb]
    if: needs.gate.outputs.changed == 'true' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          pattern: lumasave-*-${{ github.sha }}
          path: artifacts
          merge-multiple: true
      - name: Decide whether nightly may be published
        id: throttle
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          now=$(date +%s)
          published_commit=$(git ls-remote origin refs/tags/nightly | cut -f1)
          last=
          if previous=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/nightly" --jq .updated_at 2>/dev/null); then
            last=$previous
          fi
          if [[ "$published_commit" == "$GITHUB_SHA" ]]; then
            echo publish=false >> "$GITHUB_OUTPUT"
          elif [[ -z "$last" ]] || (( now - $(date -d "$last" +%s) >= 14400 )); then
            echo publish=true >> "$GITHUB_OUTPUT"
          else
            echo publish=false >> "$GITHUB_OUTPUT"
          fi
      - name: Replace rolling nightly prerelease
        if: steps.throttle.outputs.publish == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git tag -f nightly "$GITHUB_SHA"
          git push -f origin refs/tags/nightly
          if gh release view nightly >/dev/null 2>&1; then
            gh release edit nightly --prerelease --title "LumaSave nightly" --notes "Latest validated build from $GITHUB_SHA. Built for the KWin version recorded by the package."
          else
            gh release create nightly --prerelease --title "LumaSave nightly" --notes "Latest validated build from $GITHUB_SHA. Built for the KWin version recorded by the package."
          fi
          gh release upload nightly artifacts/* --clobber
